<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>เตรียมภาษีของฉัน</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@400;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #F6F3EC; }
</style>
</head>
<body>
<div id="root"></div>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script type="text/babel" data-presets="react" src="nav.js"></script>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;
const fmt = (n) => "฿" + Math.round(n || 0).toLocaleString("th-TH");
// ใช้เฉพาะในตาราง "สรุปทั้งปี" ตามที่ขอ ให้แสดงทศนิยม 2 ตำแหน่งเสมอ
const fmt2 = (n) => "฿" + (Math.round((n || 0) * 100) / 100).toLocaleString("th-TH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pct = (n, total) => ((n / total) * 100).toFixed(1) + "%";

// 🔧 ที่เก็บข้อมูลภาษี "แยกต่างหาก" จากหน้าภาพรวมการเงิน
// วาง URL ของ Google Apps Script Web App "ตัวที่ 2" (คนละ deployment / คนละ
// ไฟล์บน Drive กับของภาพรวมการเงิน) ตรงนี้ ปลายทางลงท้ายด้วย /exec
// ➜ ตราบใดที่ยังไม่วาง ข้อมูลภาษีจะถูกเก็บในเบราว์เซอร์เครื่องนี้ (localStorage)
//   ซึ่งก็แยกจากข้อมูลภาพรวมการเงินอยู่แล้ว ไม่ปนกันแน่นอน
const DRIVE_API_URL = "https://script.google.com/macros/s/AKfycbzji3LRjHP7NTk6LMfvnUgDZg_hhRr_mfMKY1BbY0iXW-E7bsADA6zxHvSa6QOjRzju4A/exec";
const DRIVE_CONFIGURED = DRIVE_API_URL && DRIVE_API_URL.indexOf("PASTE_YOUR") === -1;
const LOCAL_FALLBACK_KEY = "happy-money-tax-fallback";

// ---------- TAX PREP DATA (separate feature, own section of the store) ----------
const TAX_MONTHS = [
{ key: "01", label: "ม.ค." }, { key: "02", label: "ก.พ." }, { key: "03", label: "มี.ค." },
{ key: "04", label: "เม.ย." }, { key: "05", label: "พ.ค." }, { key: "06", label: "มิ.ย." },
{ key: "07", label: "ก.ค." }, { key: "08", label: "ส.ค." }, { key: "09", label: "ก.ย." },
{ key: "10", label: "ต.ค." }, { key: "11", label: "พ.ย." }, { key: "12", label: "ธ.ค." },
];

const TAX_FIELD_DEFS = [
{ key: "salary", label: "ค่าจ้าง (รวมเงินได้)", unit: "บาท/เดือน" },
{ key: "wht", label: "ภาษีหัก ณ ที่จ่าย", unit: "บาท/เดือน" },
{ key: "baseSalary", label: "ฐานเงินเดือน", unit: "บาท/เดือน", inheritFromJan: true },
{ key: "fixedBonus", label: "โบนัสคงที่", unit: "บาท/เดือน" },
{ key: "sso", label: "ประกันสังคม (SSO)", unit: "บาท/เดือน", inheritFromJan: true },
{ key: "pvd", label: "กองทุนสำรองเลี้ยงชีพ (PVD)", unit: "บาท/เดือน", inheritFromJan: true },
{ key: "houseInterest", label: "ดอกเบี้ยเงินกู้ที่อยู่อาศัย", unit: "บาท/เดือน" },
];
// ฟิลด์ที่ปกติไม่เปลี่ยนระหว่างปี (ฐานเงินเดือน/SSO/PVD) — กรอกแค่เดือน ม.ค.
// เดือนเดียว เดือนอื่นในปีเดียวกันจะ "ยกยอด" ค่าของเดือน ม.ค. มาแสดง/ใช้คำนวณ
// ให้อัตโนมัติ แต่ยังแก้เฉพาะเดือนใดเดือนหนึ่งทีหลังได้เสมอ (พิมพ์ค่าใหม่ในเดือน
// นั้นจะ "ตัดขาด" จากค่าของเดือน ม.ค. เฉพาะเดือนนั้นเดือนเดียว)
const CARRY_FROM_JAN_FIELDS = TAX_FIELD_DEFS.filter((f) => f.inheritFromJan).map((f) => f.key);

const INSURANCE_TYPES = [
{ key: "lifeInsurance", label: "เบี้ยประกันชีวิต" },
{ key: "healthInsurance", label: "เบี้ยประกันสุขภาพ" },
];

const emptyTaxMonth = () => ({
salary: 0, baseSalary: 0, fixedBonus: 0, wht: 0, sso: 0, pvd: 0, houseInterest: 0,
lifeInsurance: [], healthInsurance: [], specialDeductions: [],
});

// true ถ้าเดือนนั้นเคยถูกกรอก/บันทึกค่าของ field นี้ไว้อย่างชัดเจน (ไม่ใช่แค่
// ค่าเริ่มต้น 0 จาก emptyTaxMonth) — ใช้แยกแยะ "ยังไม่เคยกรอก จึงยกยอดจาก ม.ค.
// มาแสดง" ออกจาก "กรอกไว้แล้วจริง ๆ (แม้จะเป็น 0 ก็ตาม)"
function monthHasExplicitField(monthsObj, monthKey, field) {
const raw = monthsObj && monthsObj[monthKey];
return !!(raw && Object.prototype.hasOwnProperty.call(raw, field));
}
// ค่าที่ "ใช้จริง" ของเดือนหนึ่ง: เอาค่าที่บันทึกไว้ของเดือนนั้นมาก่อน ถ้า field
// ไหนอยู่ใน CARRY_FROM_JAN_FIELDS และเดือนนั้นยังไม่เคยกรอกเอง (และไม่ใช่เดือน
// ม.ค.) จะยกยอดค่าของเดือน ม.ค. (ปีเดียวกัน) มาใช้แทนโดยอัตโนมัติ
function computeEffectiveMonthData(yearData, monthKey) {
const monthsObj = (yearData && yearData.months) || {};
const raw = monthsObj[monthKey] || {};
const base = { ...emptyTaxMonth(), ...raw };
if (monthKey !== "01") {
const janRaw = monthsObj["01"] || {};
CARRY_FROM_JAN_FIELDS.forEach((field) => {
if (!monthHasExplicitField(monthsObj, monthKey, field) && monthHasExplicitField(monthsObj, "01", field)) {
base[field] = janRaw[field];
}
});
}
return base;
}

// ปีภาษี (พ.ศ.) คำนวณจากวันที่ปัจจุบันเสมอ แทนที่จะ hardcode ไว้ — ป้องกันไม่ให้
// รายการปีล้าสมัยเมื่อเวลาผ่านไป
const NOW_TAX = new Date();
const CURRENT_TAX_BE_YEAR = NOW_TAX.getFullYear() + 543;
const DEFAULT_TAX_YEAR = String(CURRENT_TAX_BE_YEAR);
const isYearKey = (k) => /^\d{4}$/.test(k);
// ช่วงปีเริ่มต้นที่ระบบ gen ให้เสมอ: ย้อนหลัง 2 ปี ถึงล่วงหน้า 1 ปี (จึงมีปีถัดไป
// ให้เลือกล่วงหน้าเสมอโดยไม่ต้องกดเพิ่มเอง)
function defaultTaxYearRange() {
  const years = [];
  for (let y = CURRENT_TAX_BE_YEAR - 2; y <= CURRENT_TAX_BE_YEAR + 1; y++) years.push(String(y));
  return years;
}

// General reference figures only (Thai personal income tax deductions) — not
// personalized advice. Always double-check current rules with the Revenue
// Department or a tax professional before filing.
const DEDUCTION_CAPS = {
sso: 9000,
lifeAndHealthCombined: 100000,
health: 25000,
houseInterest: 100000,
};

function SectionTitle({ eyebrow, title, accent }) {
return (
<div style={{ marginBottom: 12 }}>
<div style={{ fontFamily: "'IBM Plex Sans Thai', sans-serif", fontSize: 11, letterSpacing: "0.08em", color: accent || "#AD8A2E", fontWeight: 600, textTransform: "uppercase" }}>{eyebrow}</div>
<div style={{ fontFamily: "'Noto Serif Thai', serif", fontWeight: 700, fontSize: 18, color: "#202B29", marginTop: 2 }}>{title}</div>
</div>
);
}

// ---------- Tax Prep building blocks ----------
function NumberField({ label, unit, value, onChange, note }) {
return (
<div style={{ marginBottom: 14 }}>
<div style={{ marginBottom: 5 }}>
<div style={{ fontFamily: "'IBM Plex Sans Thai', sans-serif", fontSize: 12.5, fontWeight: 600, color: "#202B29" }}>{label}</div>
{unit && <div style={{ fontFamily: "'IBM Plex Sans Thai', sans-serif", fontSize: 10.5, color: "#A79E8E" }}>{unit}</div>}
</div>
<input
type="number"
value={value || ""}
onChange={(e) => onChange(parseFloat(e.target.value) || 0)}
placeholder="0"
style={{ width: "100%", padding: "10px 12px", borderRadius: 10, border: "1px solid #E6E0D2", fontFamily: "'IBM Plex Sans Thai', sans-serif", fontSize: 14, color: "#202B29", background: "#FBFAF6" }}
/>
{note && <div style={{ fontFamily: "'IBM Plex Sans Thai', sans-serif", fontSize: 10.5, color: "#AD8A2E", marginTop: 4 }}>{note}</div>}
</div>
);
}

// Generic "named item + yearly amount" list — add/remove/edit rows, each with
// a free-text name and a number. Used for insurance policies (premium/ปี) and
// for one-off special deduction items (จำนวนเงิน/ปี); the amount is stored
// under `amountField` so each usage keeps its own data key.
function ListItemRow({ item, onUpdate, onRemove, namePlaceholder, amountPlaceholder, amountField }) {
return (
<div style={{ display: "flex", gap: 8, alignItems: "flex-start", marginBottom: 10, background: "#FBFAF6", border: "1px solid #E6E0D2", borderRadius: 10, padding: 10 }}>
<div style={{ flex: 1, minWidth: 0 }}>
<input
type="text"
placeholder={namePlaceholder}
value={item.name}
onChange={(e) => onUpdate({ name: e.target.value })}
style={{ width: "100%", padding: "8px 10px", borderRadius: 8, border: "1px solid #E6E0D2", fontFamily: "'IBM Plex Sans Thai', sans-serif", fontSize: 13, color: "#202B29", background: "#FFFFFF", marginBottom: 6 }}
/>
<input
type="number"
placeholder={amountPlaceholder}
value={item[amountField] || ""}
onChange={(e) => onUpdate({ [amountField]: parseFloat(e.target.value) || 0 })}
style={{ width: "100%", padding: "8px 10px", borderRadius: 8, border: "1px solid #E6E0D2", fontFamily: "'IBM Plex Sans Thai', sans-serif", fontSize: 13, color: "#202B29", background: "#FFFFFF" }}
/>
</div>
<button onClick={onRemove} title="ลบรายการนี้" style={{ background: "none", border: "none", color: "#A79E8E", fontSize: 16, cursor: "pointer", padding: "4px 6px", flexShrink: 0 }}>✕</button>
</div>
);
}

function ListItemGroup({ title, items, onChange, namePlaceholder, amountPlaceholder, amountField, addLabel, emptyLabel }) {
const addItem = () => {
onChange([...items, { id: `${Date.now()}-${Math.random()}`, name: "", [amountField]: 0 }]);
};
const updateItem = (id, patch) => {
onChange(items.map((it) => (it.id === id ? { ...it, ...patch } : it)));
};
const removeItem = (id) => {
onChange(items.filter((it) => it.id !== id));
};
const total = items.reduce((s, it) => s + (Number(it[amountField]) || 0), 0);

return (
<div style={{ marginBottom: 16 }}>
<div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 8 }}>
<span style={{ fontFamily: "'IBM Plex Sans Thai', sans-serif", fontSize: 12.5, fontWeight: 600, color: "#202B29" }}>{title}</span>
<span style={{ fontFamily: "'IBM Plex Sans Thai', sans-serif", fontSize: 12.5, fontWeight: 700, color: "#202B29" }}>{fmt(total)}</span>
</div>
{items.length === 0 && (
<div style={{ fontFamily: "'IBM Plex Sans Thai', sans-serif", fontSize: 11.5, color: "#8C8577", marginBottom: 8 }}>
{emptyLabel}
</div>
)}
{items.map((it) => (
<ListItemRow key={it.id} item={it} onUpdate={(patch) => updateItem(it.id, patch)} onRemove={() => removeItem(it.id)}
namePlaceholder={namePlaceholder} amountPlaceholder={amountPlaceholder} amountField={amountField} />
))}
<button
onClick={addItem}
style={{ width: "100%", padding: "9px 10px", borderRadius: 10, border: "1.5px dashed #C9C2B2", background: "transparent", color: "#6B6459", fontFamily: "'IBM Plex Sans Thai', sans-serif", fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}
>
{addLabel}
</button>
</div>
);
}

function InsuranceList({ title, items, onChange }) {
return (
<ListItemGroup title={title} items={items} onChange={onChange}
namePlaceholder="ชื่อกรมธรรม์ / บริษัทประกัน" amountPlaceholder="เบี้ยประกัน/ปี" amountField="premium"
addLabel="+ เพิ่มกรมธรรม์" emptyLabel="ยังไม่มีกรมธรรม์ · เพิ่มด้วยปุ่มด้านล่าง" />
);
}

// รายการลดหย่อนพิเศษ: ลดหย่อนแบบมีชื่อ+จำนวนเงินหลายรายการ (เช่น Easy E-Receipt,
// ท่องเที่ยวเมืองรอง, มาตรการอื่น ๆ ที่ประกาศเพิ่มเติมแต่ละปี) ใช้ field "amount"
// แยกจาก "premium" ของประกัน เพื่อไม่ปนกับข้อมูลเดิม
function DeductionList({ items, onChange }) {
return (
<ListItemGroup title="รายการลดหย่อนพิเศษ" items={items} onChange={onChange}
namePlaceholder="ชื่อรายการลดหย่อน" amountPlaceholder="จำนวนเงิน/ปี" amountField="amount"
addLabel="+ เพิ่มรายการลดหย่อน" emptyLabel="ยังไม่มีรายการ · เพิ่มด้วยปุ่มด้านล่าง" />
);
}

const thStyle = { textAlign: "right", padding: "8px 6px", color: "#6B6459", fontWeight: 600, whiteSpace: "nowrap", borderBottom: "1px solid #E6E0D2" };
const tdStyle = { textAlign: "right", padding: "7px 6px", whiteSpace: "nowrap", borderBottom: "1px solid #F0EBDD" };

function useWindowWidth() {
const [w, setW] = useState(typeof window !== "undefined" ? window.innerWidth : 480);
useEffect(() => {
const onResize = () => setW(window.innerWidth);
window.addEventListener("resize", onResize);
return () => window.removeEventListener("resize", onResize);
}, []);
return w;
}

function TaxPrep({ data, loaded, syncError, persist }) {
const [year, setYear] = useState(DEFAULT_TAX_YEAR);
const [monthKey, setMonthKey] = useState(TAX_MONTHS[Math.min(new Date().getMonth(), 11)].key);
const [addingYear, setAddingYear] = useState(false);
const [newYearInput, setNewYearInput] = useState("");
const viewportWidth = useWindowWidth();
const isTablet = viewportWidth >= 640;
const isDesktop = viewportWidth >= 1024;
const containerMaxWidth = isDesktop ? 1040 : isTablet ? 640 : 480;

const taxRoot = data || {};
const yearData = taxRoot[year] || { months: {} };
const monthData = computeEffectiveMonthData(yearData, monthKey);

// รายการปีให้เลือก: gen ให้อัตโนมัติเสมอ (ย้อนหลัง 2 ปี ถึงล่วงหน้า 1 ปี) รวมกับ
// ปีไหนก็ตามที่เคยมีข้อมูลบันทึกไว้แล้ว (แม้จะอยู่นอกช่วงเริ่มต้น) และปีที่
// กดเพิ่มเองไว้ล่วงหน้า (เก็บใน __extraYears เพื่อไม่ให้หายไปตอนโหลดหน้าใหม่)
const savedYearKeys = Object.keys(taxRoot).filter(isYearKey);
const extraYears = (taxRoot.__extraYears || []).filter(isYearKey);
const yearOptions = Array.from(new Set([...defaultTaxYearRange(), ...savedYearKeys, ...extraYears])).sort();

const addYear = (yStr) => {
if (!isYearKey(yStr)) return;
const nextExtra = Array.from(new Set([...(taxRoot.__extraYears || []), yStr]));
persist({ ...taxRoot, __extraYears: nextExtra });
setYear(yStr);
};

const updateMonth = (patch) => {
// สำคัญ: merge เข้ากับ "ค่าดิบที่เคยบันทึกไว้จริง" ของเดือนนี้ ไม่ใช่ monthData
// (ซึ่งอาจมีค่าที่ยกยอดมาจาก ม.ค. ปนอยู่) — ไม่งั้นแค่แก้ field อื่น (เช่น
// ค่าจ้าง) ก็จะพาลไป "ล็อก" ค่า ฐานเงินเดือน/SSO/PVD ที่ยกยอดมาให้กลายเป็นค่า
// เฉพาะเดือนนี้ไปด้วยโดยไม่ตั้งใจ ทำให้เดือนนี้เลิกตามค่า ม.ค. ในอนาคต
const rawMonth = (yearData.months && yearData.months[monthKey]) || {};
const nextMonth = { ...rawMonth, ...patch };
const nextYearData = { ...yearData, months: { ...yearData.months, [monthKey]: nextMonth } };
persist({ ...taxRoot, [year]: nextYearData });
};

const monthsFilled = TAX_MONTHS.map((m) => ({ ...m, data: computeEffectiveMonthData(yearData, m.key) }));
const listTotal = (list, field) => (list || []).reduce((s, it) => s + (Number(it[field]) || 0), 0);
const insTotal = (list) => listTotal(list, "premium");
const sumField = (key) => monthsFilled.reduce((s, m) => s + (Number(m.data[key]) || 0), 0);
const totals = {
salary: sumField("salary"),
baseSalary: sumField("baseSalary"),
fixedBonus: sumField("fixedBonus"),
wht: sumField("wht"),
sso: sumField("sso"),
pvd: sumField("pvd"),
houseInterest: sumField("houseInterest"),
lifeInsurance: monthsFilled.reduce((s, m) => s + insTotal(m.data.lifeInsurance), 0),
healthInsurance: monthsFilled.reduce((s, m) => s + insTotal(m.data.healthInsurance), 0),
specialDeductions: monthsFilled.reduce((s, m) => s + listTotal(m.data.specialDeductions, "amount"), 0),
};

if (!loaded) {
return (
<div style={{ padding: 40, textAlign: "center", fontFamily: "'IBM Plex Sans Thai', sans-serif", color: "#6B6459" }}>
กำลังโหลดข้อมูล...
</div>
);
}

return (
<div style={{ padding: isDesktop ? "0 28px 60px" : isTablet ? "0 20px 60px" : "0 16px 60px", display: "flex", justifyContent: "center" }}>
<div style={{ width: "100%", maxWidth: containerMaxWidth }}>
<SectionTitle eyebrow="เตรียมยื่นภาษี" title={`ข้อมูลภาษีปี ${year}`} accent="#2B4C6F" />

<div style={{ fontFamily: "'IBM Plex Sans Thai', sans-serif", fontSize: 11, marginBottom: 14, color: syncError ? "#7A2E1F" : DRIVE_CONFIGURED ? "#2F5D46" : "#AD8A2E" }}>
{syncError
? "⚠️ ซิงก์ไม่สำเร็จ — แสดงข้อมูลล่าสุดที่มี และหยุดเขียนทับไว้ก่อนเพื่อกันข้อมูลหาย"
: DRIVE_CONFIGURED
? "☁️ เก็บแยกในที่เก็บภาษีของตัวเอง (คนละไฟล์กับภาพรวมการเงิน)"
: "ยังไม่ได้ตั้งค่าที่เก็บภาษีบนคลาวด์ — เก็บในเบราว์เซอร์นี้ (แยกจากภาพรวมการเงินอยู่แล้ว)"}
</div>

<div style={{ display: "flex", gap: 8, marginBottom: 14, flexWrap: "wrap", alignItems: "center" }}>
{yearOptions.map((y) => (
<button
key={y}
onClick={() => setYear(y)}
style={{ padding: "6px 14px", borderRadius: 999, fontSize: 12.5, border: y === year ? "1.5px solid #2B4C6F" : "1px solid #E6E0D2", background: y === year ? "#2B4C6F" : "#FFFFFF", color: y === year ? "#FFFFFF" : "#6B6459", cursor: "pointer", fontFamily: "'IBM Plex Sans Thai', sans-serif", fontWeight: 600 }}
>
ปีภาษี {y}
</button>
))}
{!addingYear ? (
<button
onClick={() => { const maxY = yearOptions.length ? Math.max(...yearOptions.map(Number)) : CURRENT_TAX_BE_YEAR; setNewYearInput(String(maxY + 1)); setAddingYear(true); }}
title="เพิ่มปีภาษีใหม่เอง"
style={{ padding: "6px 14px", borderRadius: 999, fontSize: 12.5, border: "1.5px dashed #2B4C6F", background: "transparent", color: "#2B4C6F", cursor: "pointer", fontFamily: "'IBM Plex Sans Thai', sans-serif", fontWeight: 600 }}
>
+ เพิ่มปี
</button>
) : (
<div style={{ display: "flex", gap: 6, alignItems: "center" }}>
<input
type="number"
value={newYearInput}
onChange={(e) => setNewYearInput(e.target.value)}
placeholder="พ.ศ."

function App() {
// taxData IS the whole tax store (its own JSON blob), keyed by year:
//   { "2569": { months: { "01": {...}, ... } }, ... }
// It lives at its OWN endpoint, completely separate from the finance page.
const [taxData, setTaxData] = useState({});
const [loaded, setLoaded] = useState(false);
const [syncError, setSyncError] = useState(false);
// If the initial cloud load fails, we must NOT write back — otherwise a
// partial/empty state could overwrite good cloud data. This blocks cloud
// writes until a successful load has happened.
const cloudSafe = useRef(!DRIVE_CONFIGURED);

useEffect(() => {
let mounted = true;
if (!DRIVE_CONFIGURED) {
try {
const raw = localStorage.getItem(LOCAL_FALLBACK_KEY);
if (mounted) setTaxData(raw ? JSON.parse(raw) : {});
} catch (e) {}
if (mounted) setLoaded(true);
return;
}
fetch(DRIVE_API_URL)
.then((r) => r.json())
.then((data) => { if (mounted) { setTaxData(data || {}); cloudSafe.current = true; } })
.catch(() => { if (mounted) setSyncError(true); })
.finally(() => { if (mounted) setLoaded(true); });
return () => { mounted = false; };
}, []);

const persist = (nextTaxData) => {
setTaxData(nextTaxData);
if (!DRIVE_CONFIGURED) {
try { localStorage.setItem(LOCAL_FALLBACK_KEY, JSON.stringify(nextTaxData)); } catch (e) {}
return;
}
if (!cloudSafe.current) return; // load failed earlier — keep it local, don't clobber cloud
setSyncError(false);
fetch(DRIVE_API_URL, {
method: "POST",
headers: { "Content-Type": "text/plain;charset=utf-8" },
body: JSON.stringify(nextTaxData),
}).catch(() => setSyncError(true));
};

return (
<div style={{ minHeight: "100vh", background: "#F6F3EC" }}>
<CrossLink active="tax" />
<TaxPrep data={taxData} loaded={loaded} syncError={syncError} persist={persist} />
</div>
);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
